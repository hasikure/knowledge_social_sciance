<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>問題の登録</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      font-size: 14px;
      background: var(--card-bg);
      color: var(--text);
      box-sizing: border-box;
      font-family: inherit;
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .field-note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 5px 0 0; }
    .form-message { font-size: 14px; margin-top: 12px; }
    .form-message.ok { color: var(--correct); }
    .form-message.error { color: var(--incorrect); }
  </style>
</head>
<body>
<main class="shell">
  <nav class="topbar">
    <a href="../../">トップ</a>
    <a href="../">先生用メニュー</a>
  </nav>
  <div class="card" id="app">
    <h1>問題の登録</h1>
    <p class="empty-note">読み込み中...</p>
  </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const app = document.getElementById("app");
  const [meRes, quizzesRes] = await Promise.all([
    fetch("/api/me"),
    fetch("/api/quizzes?include_archived=true")
  ]);
  
  const { role } = await meRes.json();
  if (role !== "teacher") {
    app.innerHTML = '<h1>問題の登録</h1><p class="empty-note">このページは先生アカウントでログインした場合のみ利用できます。</p>';
    return;
  }

  const quizzes = await quizzesRes.json();
  const selectOptions = quizzes.map(q => 
    `<option value="${q.id}">${q.name}${q.is_archived ? ' (アーカイブ済)' : ''}</option>`
  ).join('\n');

  app.innerHTML = `
    <h1>問題の登録</h1>
    <form id="item-form">
      <div class="field">
        <label for="quiz_id">クイズ</label>
        <select id="quiz_id" name="quiz_id" required>
          ${selectOptions}
        </select>
      </div>
      <div class="field">
        <label for="label">問題文(label)</label>
        <textarea id="label" name="label" required placeholder="生徒にそのまま表示されます。例: 次の説明にあてはまる地形は？&#10;「東北地方を南北に走る、日本で最も長い山脈」"></textarea>
      </div>
      <div class="field">
        <label for="answer">正解(answer)</label>
        <input type="text" id="answer" name="answer" required placeholder="例: 奥羽山脈">
      </div>
      <div class="field">
        <label for="accept">別解(任意)</label>
        <input type="text" id="accept" name="accept" placeholder="「|」で区切る。例: リアス式海岸|リアス">
        <p class="field-note">
          カタカナとひらがなの違い・全角と半角・「県」「市」などの有無・長音記号や中黒は、
          ここに書かなくても自動で正解になります。別の言い方だけを書いてください。
        </p>
      </div>
      <div class="field">
        <label for="item_key">識別キー(item_key)</label>
        <input type="text" id="item_key" name="item_key" required placeholder="クイズ内で重複しない名前。例: ouu-sanmyaku">
      </div>
      <div class="field">
        <label for="category">分類(category、任意)</label>
        <input type="text" id="category" name="category" placeholder="例: 山地・山脈、古代など。範囲を絞るときに使います">
      </div>
      <button type="submit" class="primary-btn">登録する</button>
      <p class="form-message" id="form-message"></p>
    </form>
  `;

  document.getElementById("item-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const message = document.getElementById("form-message");
    message.textContent = "";
    message.className = "form-message";

    const accept = form.accept.value
      .split("|")
      .map((s) => s.trim())
      .filter(Boolean)
      .filter((a) => a !== form.answer.value.trim());
    const body = {
      quiz_id: form.quiz_id.value,
      item_key: form.item_key.value.trim(),
      label: form.label.value.trim(),
      answer: form.answer.value.trim(),
      category: form.category.value.trim() || null,
      extra: accept.length > 0 ? { accept } : null,
    };

    const res = await fetch("/api/items", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (res.ok) {
      message.textContent = "登録しました。";
      message.classList.add("ok");
      form.reset();
    } else {
      const text = await res.text();
      message.textContent = `登録に失敗しました: ${text}`;
      message.classList.add("error");
    }
  });
});
</script>
</body>
</html>
