<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>問題一覧</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .quiz-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .quiz-tab {
      padding: 7px 13px;
      font-size: 14px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
    }
    .quiz-tab:hover { border-color: var(--accent); }
    .quiz-tab.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .item-table-wrap { overflow-x: auto; }
    .item-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .item-table th, .item-table td {
      border-bottom: 1px solid var(--hairline);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
    }
    .item-table th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
    .item-table th .th-type { display: block; font-weight: 400; opacity: 0.75; }
    .item-table td.col-no { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .item-table td.col-key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
    .item-table td.col-label { white-space: pre-wrap; min-width: 300px; }
    .item-table td.col-answer { font-weight: 600; color: var(--correct); }
    .item-table td.col-accept { color: var(--muted); }
    .item-table td.col-extra {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--muted);
      max-width: 260px;
      word-break: break-all;
    }
    .item-table td.col-visual svg { width: 58px; height: 58px; display: block; color: var(--text); }
    .item-mastery { font-size: 12px; white-space: nowrap; }
    .archived-note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    .view-note { color: var(--muted); font-size: 12px; line-height: 1.7; margin: 0 0 12px; }
  </style>
</head>
<body>
<main class="shell">
  <nav class="topbar">
    <a href="../../">トップ</a>
    <a href="../">先生用メニュー</a>
  </nav>
  <div class="card" id="app">
    <h1>問題一覧</h1>
    <p class="empty-note">読み込み中...</p>
  </div>
</main>

<script src="../../assets/chizu-kigou-symbols.js?v=shinyojurin-scale-v1"></script>
<script src="../../assets/questions.js"></script>
<script src="../../assets/questions/chizu-kigou.js"></script>
<script src="../../assets/questions/todofuken-chizu.js"></script>
<script>
const MASTERY_LABEL = {
  unseen: "未出題",
  "correct-once": "1回正解",
  mastered: "2回連続正解",
  "incorrect-once": "1回間違い",
  struggling: "2回連続間違い",
};

// items テーブルの列。DBの1行がそのまま1問なので、これが出題内容そのものになる。
const ITEM_COLUMNS = [
  { key: "item_key", label: "item_key", type: "TEXT", className: "col-key" },
  { key: "label", label: "label", type: "TEXT / 問題文", className: "col-label" },
  { key: "answer", label: "answer", type: "TEXT / 正解", className: "col-answer" },
  { key: "accept", label: "accept", type: "別解(extra_json内)", className: "col-accept" },
  { key: "category", label: "category", type: "TEXT", className: "col-category" },
  { key: "extra_json", label: "extra_json", type: "TEXT / 補足", className: "col-extra" },
];

function cellValue(item, key) {
  if (key === "accept") {
    const accept = item.extra && item.extra.accept;
    return Array.isArray(accept) ? accept.join(" | ") : "";
  }
  if (key === "extra_json") {
    if (!item.extra) return "";
    // accept は専用列に出しているので、ここでは繰り返さない
    const rest = { ...item.extra };
    delete rest.accept;
    return Object.keys(rest).length === 0 ? "" : JSON.stringify(rest);
  }
  return item[key] == null ? "" : String(item[key]);
}

document.addEventListener("DOMContentLoaded", async () => {
  const app = document.getElementById("app");

  const [meRes, quizzesRes] = await Promise.all([
    fetch("/api/me"),
    fetch("/api/quizzes?include_archived=true"),
  ]);
  const { role } = await meRes.json();
  if (role !== "teacher") {
    app.innerHTML =
      '<h1>問題一覧</h1><p class="empty-note">このページは先生アカウントでログインした場合のみ利用できます。</p>';
    return;
  }

  // 現役のクイズを先に、アーカイブ済みを後ろにまとめる。
  const quizzes = (await quizzesRes.json()).sort((a, b) => a.is_archived - b.is_archived);
  if (quizzes.length === 0) {
    app.innerHTML = '<h1>問題一覧</h1><p class="empty-note">クイズが登録されていません。</p>';
    return;
  }

  app.innerHTML = `
    <h1>問題一覧</h1>
    <div class="quiz-tabs" id="quiz-tabs"></div>
    <p class="view-note">
      items テーブルの中身です。1行が1問で、label がそのまま生徒に出る問題文になります。
      別解は accept 列に書きます。カタカナとひらがなの違い・全角と半角・「県」「市」などの有無・
      長音記号や中黒は、accept に書かなくても自動で正解として扱われます。
    </p>
    <p class="archived-note" id="archived-note" hidden></p>
    <div id="item-area"><p class="empty-note">読み込み中...</p></div>
  `;

  const tabs = document.getElementById("quiz-tabs");
  const area = document.getElementById("item-area");
  const archivedNote = document.getElementById("archived-note");

  quizzes.forEach((quiz) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "quiz-tab";
    btn.dataset.quizId = quiz.id;
    btn.textContent = quiz.name;
    btn.addEventListener("click", () => show(quiz));
    tabs.appendChild(btn);
  });

  async function show(quiz) {
    tabs.querySelectorAll(".quiz-tab").forEach((b) => {
      b.classList.toggle("is-active", b.dataset.quizId === quiz.id);
    });
    archivedNote.hidden = !quiz.is_archived;
    archivedNote.textContent = quiz.is_archived
      ? "このクイズはアーカイブ済みです(生徒の画面には出ません)。"
      : "";

    area.innerHTML = '<p class="empty-note">読み込み中...</p>';
    const res = await fetch(`/api/items?quiz_id=${encodeURIComponent(quiz.id)}&scope=all`);
    if (!res.ok) {
      area.innerHTML = '<p class="empty-note">問題を取得できませんでした。</p>';
      return;
    }
    const items = await res.json();
    if (items.length === 0) {
      area.innerHTML = '<p class="empty-note">このクイズにはまだ問題がありません。</p>';
      return;
    }

    // 図を使うクイズ(地図記号・都道府県の地図)は、問題文だけでは区別できないので絵も出す。
    const showsVisual = ChishikiQuestions.hasVisual(quiz.id);

    const table = document.createElement("table");
    table.className = "item-table";

    const head = document.createElement("tr");
    const headings = [
      { label: "#" },
      ...(showsVisual ? [{ label: "図", type: "item_keyから生成" }] : []),
      ...ITEM_COLUMNS,
      { label: "習熟度", type: "attemptsから算出" },
    ];
    headings.forEach((h) => {
      const th = document.createElement("th");
      th.textContent = h.label;
      if (h.type) {
        const type = document.createElement("span");
        type.className = "th-type";
        type.textContent = h.type;
        th.appendChild(type);
      }
      head.appendChild(th);
    });
    table.appendChild(head);

    items.forEach((item, index) => {
      const tr = document.createElement("tr");

      const no = document.createElement("td");
      no.className = "col-no";
      no.textContent = index + 1;
      tr.appendChild(no);

      if (showsVisual) {
        const visual = document.createElement("td");
        visual.className = "col-visual";
        const built = ChishikiQuestions.buildVisual(quiz.id, item);
        if (built) visual.appendChild(built);
        tr.appendChild(visual);
      }

      ITEM_COLUMNS.forEach((column) => {
        const td = document.createElement("td");
        td.className = column.className;
        td.textContent = cellValue(item, column.key);
        tr.appendChild(td);
      });

      const mastery = document.createElement("td");
      mastery.className = "item-mastery";
      mastery.textContent = MASTERY_LABEL[item.mastery] || item.mastery;
      tr.appendChild(mastery);

      table.appendChild(tr);
    });

    const wrap = document.createElement("div");
    wrap.className = "item-table-wrap";
    wrap.appendChild(table);

    const count = document.createElement("p");
    count.className = "empty-note";
    count.textContent = `${items.length}問`;

    area.innerHTML = "";
    area.append(count, wrap);
  }

  show(quizzes[0]);
});
</script>
</body>
</html>
