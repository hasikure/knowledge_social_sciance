<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>問題一覧</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .quiz-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .quiz-tab {
      padding: 7px 13px;
      font-size: 14px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
    }
    .quiz-tab:hover { border-color: var(--accent); }
    .quiz-tab.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .quiz-tab .tab-count { opacity: 0.7; margin-left: 5px; font-size: 12px; }

    .item-table-wrap { overflow-x: auto; }
    .item-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .item-table th, .item-table td {
      border-bottom: 1px solid var(--hairline);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
    }
    .item-table th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
    .item-table td.col-no { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .item-table td.col-item { min-width: 130px; }
    .item-table td.col-question { min-width: 320px; }
    .item-name { font-weight: 600; margin-top: 4px; }
    .question-preview { padding: 6px 0; }
    .question-preview + .question-preview { border-top: 1px dashed var(--hairline); }
    .question-prompt { white-space: pre-wrap; margin: 0 0 3px; }
    .question-answer { margin: 0; font-weight: 600; color: var(--correct); }
    .question-accept { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .item-table td.col-answer { font-weight: 600; white-space: nowrap; }
    .item-table td.col-category, .item-table td.col-hint { color: var(--muted); }
    .item-table svg { width: 62px; height: 62px; display: block; color: var(--text); }
    .item-mastery { font-size: 12px; white-space: nowrap; }
    .archived-note { color: var(--muted); font-size: 13px; margin: -6px 0 16px; }
  </style>
</head>
<body>
<main class="shell">
  <nav class="topbar">
    <a href="../../">トップ</a>
    <a href="../">先生用メニュー</a>
  </nav>
  <div class="card" id="app">
    <h1>問題一覧</h1>
    <p class="empty-note">読み込み中...</p>
  </div>
</main>

<script src="../../assets/chizu-kigou-symbols.js"></script>
<script src="../../assets/questions.js"></script>
<script src="../../assets/questions/chikei.js"></script>
<script src="../../assets/questions/nihon-chiri.js"></script>
<script src="../../assets/questions/sekai-isan.js"></script>
<script src="../../assets/questions/rekishi.js"></script>
<script src="../../assets/questions/chizu-kigou.js"></script>
<script src="../../assets/questions/todofuken-chizu.js"></script>
<script>
const MASTERY_LABEL = {
  unseen: "未出題",
  "correct-once": "1回正解",
  mastered: "2回連続正解",
  "incorrect-once": "1回間違い",
  struggling: "2回連続間違い",
};

function hintOf(item) {
  if (!item.extra) return "";
  if (item.extra.hint) return item.extra.hint;
  const rest = Object.entries(item.extra).filter(([k]) => k !== "hint");
  return rest.length ? rest.map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join("・") : v}`).join(" / ") : "";
}

document.addEventListener("DOMContentLoaded", async () => {
  const app = document.getElementById("app");

  const [meRes, quizzesRes] = await Promise.all([
    fetch("/api/me"),
    fetch("/api/quizzes?include_archived=true"),
  ]);
  const { role } = await meRes.json();
  if (role !== "teacher") {
    app.innerHTML =
      '<h1>問題一覧</h1><p class="empty-note">このページは先生アカウントでログインした場合のみ利用できます。</p>';
    return;
  }

  // 現役のクイズを先に、アーカイブ済みを後ろにまとめる。
  const quizzes = (await quizzesRes.json()).sort((a, b) => a.is_archived - b.is_archived);
  if (quizzes.length === 0) {
    app.innerHTML = '<h1>問題一覧</h1><p class="empty-note">クイズが登録されていません。</p>';
    return;
  }

  app.innerHTML = `
    <h1>問題一覧</h1>
    <div class="quiz-tabs" id="quiz-tabs"></div>
    <p class="archived-note" id="archived-note" hidden></p>
    <div id="item-area"><p class="empty-note">読み込み中...</p></div>
  `;

  const tabs = document.getElementById("quiz-tabs");
  const area = document.getElementById("item-area");
  const archivedNote = document.getElementById("archived-note");

  quizzes.forEach((quiz) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "quiz-tab";
    btn.dataset.quizId = quiz.id;
    btn.textContent = quiz.name;
    btn.addEventListener("click", () => show(quiz));
    tabs.appendChild(btn);
  });

  async function show(quiz) {
    tabs.querySelectorAll(".quiz-tab").forEach((b) => {
      b.classList.toggle("is-active", b.dataset.quizId === quiz.id);
    });
    archivedNote.hidden = !quiz.is_archived;
    archivedNote.textContent = quiz.is_archived
      ? "このクイズはアーカイブ済みです(生徒の画面には出ません)。"
      : "";

    area.innerHTML = '<p class="empty-note">読み込み中...</p>';
    const res = await fetch(`/api/items?quiz_id=${encodeURIComponent(quiz.id)}&scope=all`);
    if (!res.ok) {
      area.innerHTML = '<p class="empty-note">問題を取得できませんでした。</p>';
      return;
    }
    const items = await res.json();
    if (items.length === 0) {
      area.innerHTML = '<p class="empty-note">この クイズにはまだ問題がありません。</p>';
      return;
    }

    // 地図記号クイズだけは記号の絵を出す(item_key で共有モジュールから引く)
    const hasSymbols = items.some((it) => ChizuKigou.build(it.item_key));

    const table = document.createElement("table");
    table.className = "item-table";
    const head = document.createElement("tr");
    const columns = ["#", "項目", "実際の出題", "分類", "習熟度"];
    columns.forEach((name) => {
      const th = document.createElement("th");
      th.textContent = name;
      head.appendChild(th);
    });
    table.appendChild(head);

    items.forEach((item, index) => {
      const tr = document.createElement("tr");

      const no = document.createElement("td");
      no.className = "col-no";
      no.textContent = index + 1;

      // 項目そのもの(地図記号なら記号の絵)
      const main = document.createElement("td");
      main.className = "col-item";
      const svg = hasSymbols ? ChizuKigou.build(item.item_key) : null;
      if (svg) main.appendChild(svg);
      const name = document.createElement("div");
      name.className = "item-name";
      name.textContent = item.label;
      main.appendChild(name);

      // その項目から実際に出る問題を全パターン。出題ページと同じ定義を使う。
      const questions = document.createElement("td");
      questions.className = "col-question";
      const previews = ChishikiQuestions.previewsFor(quiz.id, item);
      if (previews.length === 0) {
        const note = document.createElement("p");
        note.className = "empty-note";
        note.textContent = "(出題定義が読み込まれていません)";
        questions.appendChild(note);
      }
      previews.forEach((q) => {
        const block = document.createElement("div");
        block.className = "question-preview";

        const prompt = document.createElement("p");
        prompt.className = "question-prompt";
        prompt.textContent = q.prompt;

        const ans = document.createElement("p");
        ans.className = "question-answer";
        ans.textContent = `答え: ${q.answer}`;
        block.append(prompt, ans);

        // 正解として受け付ける別の書き方。無ければ出さない。
        // CSVの accept 列は「その項目の答えを問う問題」にだけ効く(assets/quiz.js と同じ条件)。
        // 年代や人物を問う問題には効かないので、そこには出さない。
        const itemAccept = q.answer === item.answer ? (item.extra && item.extra.accept) || [] : [];
        const alternatives = [...(q.accept || []).filter((a) => a !== q.answer), ...itemAccept];
        if (alternatives.length > 0) {
          const acc = document.createElement("p");
          acc.className = "question-accept";
          acc.textContent = `別解: ${[...new Set(alternatives)].join(" / ")}`;
          block.appendChild(acc);
        }
        questions.appendChild(block);
      });

      const category = document.createElement("td");
      category.className = "col-category";
      category.textContent = item.category || "";

      const mastery = document.createElement("td");
      mastery.className = "item-mastery";
      mastery.textContent = MASTERY_LABEL[item.mastery] || item.mastery;

      tr.append(no, main, questions, category, mastery);
      table.appendChild(tr);
    });

    const wrap = document.createElement("div");
    wrap.className = "item-table-wrap";
    wrap.appendChild(table);

    const count = document.createElement("p");
    count.className = "empty-note";
    count.textContent = `${items.length}問`;

    area.innerHTML = "";
    area.append(count, wrap);
  }

  show(quizzes[0]);
});
</script>
</body>
</html>
