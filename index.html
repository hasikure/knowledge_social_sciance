<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知識クイズ</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="shell">
  <div class="card">
    <h1>知識クイズ</h1>

    <section class="start-panel" aria-label="学習を始める">
      <p class="eyebrow">今日の一問一答</p>
      <button type="button" class="primary-btn start-btn" id="quick-start">学習を始める</button>
    </section>

    <div class="kpi-row">
      <div class="stat-tile">
        <p class="stat-label">レベル</p>
        <p class="stat-value">Lv. <span id="stat-level">1</span></p>
        <div class="meter-track level-meter">
          <div class="meter-fill" id="level-meter-fill"></div>
        </div>
        <p class="stat-unit" id="level-caption"></p>
      </div>
      <div class="stat-tile">
        <p class="stat-label">連続プレイ日数</p>
        <p class="stat-value" id="stat-streak">0<span class="stat-unit">日</span></p>
      </div>
      <div class="stat-tile score-tile">
        <p class="stat-label">総合スコア</p>
        <p class="stat-value"><span class="score-dot" id="score-dot"></span><span id="stat-score">0</span><span class="stat-unit" id="stat-score-max">/ 0</span></p>
      </div>
    </div>

    <section class="subject-section">
      <div class="section-header">
        <h2>学習する</h2>
      </div>
      <div class="subject-grid" id="subject-grid"></div>
    </section>

    <section class="subject-section mastery-overview">
      <div class="section-header">
        <h2>習熟度一覧</h2>
        <a href="genres/">詳細 →</a>
      </div>
      <div id="mastery-tree"></div>
    </section>

    <section class="subject-section progress-section">
      <h2>今週の進み具合</h2>
      <div id="task-list"></div>
    </section>

    <p class="fine-print" id="teacher-link" hidden style="text-align:right;">
      <a href="teacher/">先生用メニュー →</a>
    </p>
  </div>
</main>

<script src="assets/tier.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const WEEKLY_TARGET = 7; // 週に1日1回ペースのイメージ
  const SUBJECT_LABELS = { syakai: "社会", rika: "理科" };

  const [res, meRes] = await Promise.all([fetch("/api/dashboard"), fetch("/api/me")]);
  const data = await res.json();
  const me = await meRes.json();
  if (me.role === "teacher") {
    document.getElementById("teacher-link").hidden = false;
  }

  const pct = data.totalMax > 0 ? (data.totalScore / data.totalMax) * 100 : 0;
  const tier = TierScale.tierFor(pct);
  const { level, total: xpTotal, base: xpBase, next: xpNext } = data.xp;

  document.getElementById("stat-level").textContent = level;
  document.getElementById("stat-streak").innerHTML = `${data.streak}<span class="stat-unit">日 🔥</span>`;
  document.getElementById("stat-score").textContent = data.totalScore;
  document.getElementById("stat-score-max").textContent = `/ ${data.totalMax}`;
  document.getElementById("score-dot").style.background = tier.bg;

  const withinLevelPct = xpNext === null ? 100 : Math.min(100, ((xpTotal - xpBase) / (xpNext - xpBase)) * 100);
  document.getElementById("level-meter-fill").style.width = `${withinLevelPct}%`;
  document.getElementById("level-caption").textContent =
    xpNext === null ? "MAX" : `次のレベルまで あと${Math.max(0, xpNext - xpTotal)}XP`;

  const subjectGrid = document.getElementById("subject-grid");
  const masteryTree = document.getElementById("mastery-tree");
  const quickStart = document.getElementById("quick-start");
  quickStart.addEventListener("click", () => {
    const available = data.genres.filter((genre) => genre.url);
    if (!available.length) return;
    const genre = available[Math.floor(Math.random() * available.length)];
    window.location.href = genre.url;
  });
  const subjects = new Map();
  data.genres.forEach((quiz) => {
    const subjectKey = quiz.subject || "other";
    if (!subjects.has(subjectKey)) subjects.set(subjectKey, []);
    subjects.get(subjectKey).push(quiz);
  });

  subjects.forEach((quizzes, subjectKey) => {
    const pct = quizzes.reduce((sum, quiz) => sum + quiz.pct, 0) / quizzes.length;
    const tier = TierScale.tierFor(pct);
    const card = document.createElement("a");
    card.className = "subject-card";
    card.href = `${subjectKey}/`;
    card.style.setProperty("--tier-color", tier.bg);

    const name = document.createElement("span");
    name.className = "subject-card-name";
    name.textContent = SUBJECT_LABELS[subjectKey] || subjectKey;

    const status = document.createElement("span");
    status.className = "subject-card-status";
    status.style.color = tier.bg;
    status.textContent = tier.name;

    const dot = document.createElement("span");
    dot.className = "subject-card-dot";
    dot.style.background = tier.bg;

    card.append(name, status, dot);
    subjectGrid.appendChild(card);

    const subject = document.createElement("section");
    subject.className = "mastery-subject";

    const subjectHeader = document.createElement("div");
    subjectHeader.className = "mastery-subject-header";
    const subjectName = document.createElement("h3");
    subjectName.textContent = SUBJECT_LABELS[subjectKey] || subjectKey;
    const subjectDot = document.createElement("span");
    subjectDot.className = "mastery-subject-dot";
    subjectDot.style.background = tier.bg;
    subjectHeader.append(subjectName, subjectDot);
    subject.appendChild(subjectHeader);

    const sections = new Map();
    quizzes.forEach((quiz) => {
      const sectionName = quiz.section || "その他";
      if (!sections.has(sectionName)) sections.set(sectionName, []);
      sections.get(sectionName).push(quiz);
    });

    sections.forEach((sectionQuizzes, sectionName) => {
      const group = document.createElement("div");
      group.className = "mastery-group";
      const heading = document.createElement("h4");
      heading.textContent = sectionName;
      const grid = document.createElement("div");
      grid.className = "mastery-item-grid";

      sectionQuizzes.forEach((quiz) => {
        const quizTier = TierScale.tierFor(quiz.pct);
        const item = document.createElement("a");
        item.className = "mastery-item";
        item.href = quiz.url || "#";
        const itemName = document.createElement("span");
        itemName.className = "mastery-item-name";
        itemName.textContent = quiz.name;
        const itemDot = document.createElement("span");
        itemDot.className = "mastery-item-dot";
        itemDot.style.background = quizTier.bg;
        item.append(itemName, itemDot);
        grid.appendChild(item);
      });

      group.append(heading, grid);
      subject.appendChild(group);
    });
    masteryTree.appendChild(subject);
  });

  // 進捗: 今週(月曜リセット)の演習ラウンド数チェックリスト。
  const weeklyCount = Math.min(WEEKLY_TARGET, data.weeklyCount);

  const taskList = document.getElementById("task-list");
  const item = document.createElement("div");
  item.className = "task-item";
  const top = document.createElement("div");
  top.className = "task-item-top";
  const name = document.createElement("span");
  name.className = "task-item-name";
  name.textContent = "1. 演習に取り組む";
  const count = document.createElement("span");
  count.className = "task-item-count";
  count.textContent = `${weeklyCount} / ${WEEKLY_TARGET}`;
  top.append(name, count);

  const track = document.createElement("div");
  track.className = "meter-track";
  const fill = document.createElement("div");
  fill.className = "meter-fill" + (weeklyCount >= WEEKLY_TARGET ? " is-complete" : "");
  fill.style.width = `${(weeklyCount / WEEKLY_TARGET) * 100}%`;
  track.appendChild(fill);

  item.append(top, track);
  taskList.appendChild(item);

});
</script>
</body>
</html>
