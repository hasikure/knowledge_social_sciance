<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地図記号クイズ</title>
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<main class="shell">
  <nav class="topbar">
    <a href="../../">トップ</a>
    <a href="../">社会</a>
  </nav>
  <div class="card" id="quiz-app"></div>
</main>

<script src="../../assets/chizu-kigou-symbols.js"></script>
<script src="../../assets/quiz.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  function buildSymbolVisual(item) {
    const wrap = document.createElement("div");
    wrap.className = "quiz-symbol-visual";
    const svg = ChizuKigou.build(item.item_key);
    if (svg) wrap.appendChild(svg);
    return wrap;
  }

  const questionTypes = [
    {
      build(item) {
        return {
          prompt: "次の地図記号は何を表しているか。",
          answer: item.answer,
          visual: buildSymbolVisual(item),
        };
      },
    },
  ];

  ChishikiQuiz.run({
    mountId: "quiz-app",
    quizId: "chizu-kigou",
    title: "地図記号クイズ",
    questionTypes,
  });
});
</script>
</body>
</html>
