<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本の世界遺産クイズ</title>
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<main class="shell">
  <nav class="topbar">
    <a href="../../">トップ</a>
    <a href="../">社会</a>
  </nav>
  <div class="card" id="quiz-app"></div>
</main>

<script src="../../assets/quiz.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const questionTypes = [
    {
      // 説明 → 名称
      build(item) {
        return {
          prompt: `次の説明にあてはまる世界遺産は？\n「${item.extra.hint}」`,
          answer: item.label,
        };
      },
    },
    {
      // 名称 → 所在都道府県
      build(item) {
        return {
          prompt: `「${item.label}」の主な所在都道府県は？`,
          answer: item.extra.prefectures[0],
        };
      },
    },
    {
      // 名称 → 文化遺産/自然遺産
      build(item) {
        return {
          prompt: `「${item.label}」は文化遺産・自然遺産のどちらに分類される？`,
          answer: item.category,
        };
      },
    },
  ];

  ChishikiQuiz.run({
    mountId: "quiz-app",
    quizId: "sekai-isan",
    title: "日本の世界遺産クイズ",
    questionTypes,
  });
});
</script>
</body>
</html>
